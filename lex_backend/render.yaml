services:
  - type: web
    name: nexuslexis-lex
    runtime: python
    rootDir: lex_backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: LEX_QUESTION_BANK_URL
        sync: false
      - key: LLM_GENERATION_TIMEOUT
        value: "60"
      - key: PYTHON_VERSION
        value: "3.12"
