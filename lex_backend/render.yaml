services:
  - type: web
    name: nexuslexis-lex
    runtime: python
    rootDir: lex_backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: qwen2.5:7b-instruct
      - key: LLM_GENERATION_TIMEOUT
        value: "120"
      - key: PYTHON_VERSION
        value: "3.12"
